<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricket News AI</title>
<style>
body{font-family:Arial;background:#101827;color:white;padding:20px}
.container{max-width:650px;margin:auto}
h1{color:#35d07f;text-align:center}
textarea,select,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;box-sizing:border-box}
textarea{height:120px}
button{background:#16a765;color:white;border:0;font-size:17px}
#result{white-space:pre-wrap;background:#202d40;padding:15px;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h1>🏏 Cricket News AI</h1>
<p>Create cricket content in Urdu or English</p>

<textarea id="topic" placeholder="Enter cricket news topic..."></textarea>

<select id="language">
<option value="Urdu">Urdu</option>
<option value="English">English</option>
</select>

<button onclick="createPost()">Create Post</button>
<div id="result"></div>
</div>

<script>
async function createPost(){
const topic=document.getElementById("topic").value.trim();
const language=document.getElementById("language").value;
const result=document.getElementById("result");

if(!topic){result.innerText="Please enter a cricket topic.";return;}

result.innerText="Creating cricket content... Please wait.";

try{
const response=await fetch("https://cricket-news-ai-2026.mustafakhanabcd69.workers.dev",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({topic,language})
});

const data=await response.json();
if(!response.ok) throw new Error(data.error || "Something went wrong");

result.innerText=data.result;
}catch(error){
result.innerText="Error: "+error.message;
}
}
</script>
</body>
</html>
